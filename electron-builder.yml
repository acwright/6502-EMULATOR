appId: com.acwright.emulator6502
productName: AC6502 Emulator
copyright: Copyright © 2026 A.C. Wright Design

directories:
  buildResources: build
  output: dist

files:
  - out/**/*

extraResources:
  - from: assets
    to: assets

mac:
  target:
    - target: dmg
      arch:
        - arm64
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true

dmg:
  artifactName: ac6502-emulator-${version}-mac-${arch}.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ac6502-emulator-${version}-win-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: ac6502-emulator-${version}-linux-${arch}.${ext}

# The package itself stays 6502-emulator, so apt sees 3.1.1 as an upgrade of
# 3.1.0 rather than a second app; only the file is renamed.
deb:
  artifactName: ac6502-emulator_${version}_${arch}.${ext}

asarUnpack:
  - "**/*.node"

npmRebuild: true
