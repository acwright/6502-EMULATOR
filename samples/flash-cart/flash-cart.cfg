# ***                          ***
# ***     6502 128K CONFIG      ***
# ***                          ***
#
#   A banked cartridge for the AC6502 Flash Cart: SST39SF010A, 131,072 bytes.
#
#   A byte copy of 6502-CRT's `6502-128K.cfg`, which `tools/make-cart-cfg.mjs`
#   generates there. It is copied rather than adapted on purpose: this sample
#   exists to prove the emulator runs what that template builds, and a config
#   of its own invention would prove something else.
#
#   THE MAPPER (6502-VCS PLAN.md §2)
#   --------------------------------
#   $C000-$DFFF  8 KB switchable window. Which bank appears here is the value
#                last written to the bank register.
#   $E000-$FFFF  8 KB fixed region — the primary chip's last 8 KB, always, and
#                the only place the reset and interrupt vectors can live.
#
#   The bank register is write-only at ANY address in $E000-$FFFF (`BANK` in
#   Cart.asm is $E000 by convention), it cannot be read back, and RESB clears it
#   to 0. **A write there latches the register and reaches no flash.**
#
#   THE SEGMENT NAME IS THE VALUE YOU WRITE
#   ---------------------------------------
#   `.segment "BANK07"` is reached with `lda #$07` / `jsr SetBank`.
#   Usable bank values here: $00-$0E (15 banks, 120 KB).
#   $0F is the fixed bank and has no BANK segment: it is FIXED.
#
#   WHY fillval=$FF
#   ---------------
#   $FF is what an erased flash chip holds, so every unused byte already matches
#   the chip after a chip erase and `6502-flash program` skips the sector
#   outright. A small cart in a big image programs in seconds instead of a
#   minute and a half. The legacy 6502.cfg keeps fillval=$00 — an EEPROM has no
#   erased state to exploit.
#
#   WHY THE DECLARATION ORDER MATTERS
#   ---------------------------------
#   ld65 writes each MEMORY area that names a file to that file in the order the
#   areas are declared, and that order IS the flash's linear layout. Do not
#   reorder these blocks.
#
#   See the 6502-DOCS chapter *Bigger cartridges*, and 6502-CRT's README section
#   *Building for the Flash Cart*.

MEMORY {
  BANK00:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;  # the switchable window, $C000-$DFFF
  BANK01:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK02:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK03:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK04:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK05:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK06:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK07:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK08:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK09:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK0A:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK0B:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK0C:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK0D:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  BANK0E:  start=$C000, size=$2000, file="%O", fill=yes, fillval=$FF;
  FIXED:   start=$E000, size=$1FFA, file="%O", fill=yes, fillval=$FF;  # always visible, whatever the register holds (bank $0F)
  VECTORS: start=$FFFA, size=$0006, file="%O", fill=yes, fillval=$FF;  # NMI, RESET, IRQ — never bankable
}

SEGMENTS {
  BANK00:  load=BANK00,  type=ro, optional=yes;
  BANK01:  load=BANK01,  type=ro, optional=yes;
  BANK02:  load=BANK02,  type=ro, optional=yes;
  BANK03:  load=BANK03,  type=ro, optional=yes;
  BANK04:  load=BANK04,  type=ro, optional=yes;
  BANK05:  load=BANK05,  type=ro, optional=yes;
  BANK06:  load=BANK06,  type=ro, optional=yes;
  BANK07:  load=BANK07,  type=ro, optional=yes;
  BANK08:  load=BANK08,  type=ro, optional=yes;
  BANK09:  load=BANK09,  type=ro, optional=yes;
  BANK0A:  load=BANK0A,  type=ro, optional=yes;
  BANK0B:  load=BANK0B,  type=ro, optional=yes;
  BANK0C:  load=BANK0C,  type=ro, optional=yes;
  BANK0D:  load=BANK0D,  type=ro, optional=yes;
  BANK0E:  load=BANK0E,  type=ro, optional=yes;
  FIXED:   load=FIXED,   type=ro;
  VECTORS: load=VECTORS, type=ro;
}
