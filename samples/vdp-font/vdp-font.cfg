# Linker config for an AC6502 cartridge.
#
# A cartridge file is the whole $8000-$FFFF image, 32768 bytes: the emulator's
# `Cart` class takes nothing else, and an EEPROM burner wants the same. Only
# $C000 upward is mapped when a cartridge is present, so PAD is sixteen
# kilobytes of nothing that exists to make the file the right length.
#
# Taken from the 6502-CRT cartridge template, unchanged.

MEMORY {
  PAD:      start=$8000, size=$4000, file="%O", fill=yes, fillval=$00;
  CART:     start=$C000, size=$3FFA, file="%O", fill=yes, fillval=$00;
  VECTORS:  start=$FFFA, size=$0006, file="%O", fill=yes, fillval=$00;
}

SEGMENTS {
  CART:           load=CART,          type=ro;
  VECTORS:        load=VECTORS,       type=ro;
}
